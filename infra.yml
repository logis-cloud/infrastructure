AWSTemplateFormatVersion: "2010-09-09"
Description: "Infraestructura Completa Proyecto Cloud - 4 VMs con IaC + ALB interno + API Gateway + Glue/Athena"

Parameters:
  IngestaInstanceProfile:
    Type: String
    Default: "LabInstanceProfile"
    Description: "Instance profile del Learner Lab; permite a VMIngesta y VMProd escribir/leer S3 y Athena sin credenciales manuales"
  AMI:
    Type: String
    Default: "ami-0b33d2f1547e52c78"
    Description: "AMI con Docker y Ubuntu preconfigurados"
  KeyName:
    Type: String
    Default: "vockey"
    Description: "Clave SSH de AWS"
  VpcId:
    Type: "AWS::EC2::VPC::Id"
    Description: "VPC donde se crean los Security Groups (selecciona la VPC por defecto de tu cuenta/Learner Lab)"

  NombreBucketDatos:
    Type: String
    Default: "logistica-grupo-1-2026"
    Description: "Prefijo del bucket unico de ingesta. Se le agrega el AccountId automaticamente para que no choque con el bucket que ya existe en otra cuenta."

  Prod1SubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0cc09d979bb259e78"
    Description: "Subnet de VMProd1 (us-east-1c)"

  Prod2SubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0dbb6c9a39936a6ba"
    Description: "Subnet de VMProd2 (us-east-1a)"

  DBSubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0cc09d979bb259e78"
    Description: "Subnet de la VM de base de datos (us-east-1c)"

  IngestaSubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Description: "Subnet de la VM de ingesta (us-east-1d). Completar con el id real de la subnet en esa zona."

  ALBSubnet1Id:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0cc09d979bb259e78"
    Description: "Subnet 1 del ALB (us-east-1c)"

  ALBSubnet2Id:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0dbb6c9a39936a6ba"
    Description: "Subnet 2 del ALB (us-east-1a)"

Resources:
  # =========================================================
  # 1. SECURITY GROUPS (REGLAS DE FIREWALL)
  # =========================================================

  ALBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso al ALB interno desde el VPC Link"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "80"
          ToPort: "80"
          CidrIp: "172.31.0.0/16"

  ProdSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso a APIs de produccion SOLO desde el ALB, mas SSH"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8001"
          ToPort: "8001"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8002"
          ToPort: "8002"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8003"
          ToPort: "8003"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8004"
          ToPort: "8004"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8005"
          ToPort: "8005"
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  IngestionSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso SSH para VM de Ingesta"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"

  DBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso Privado a Bases de Datos"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup

  VpcLinkSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "SG para las ENIs del VPC Link de API Gateway (HTTP API hacia ALB privado)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "tcp"
          FromPort: "80"
          ToPort: "80"
          DestinationSecurityGroupId: !Ref ALBSecurityGroup

  ALBIngressFromVpcLink:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: "tcp"
      FromPort: "80"
      ToPort: "80"
      SourceSecurityGroupId: !Ref VpcLinkSecurityGroup

  # =========================================================
  # 2. BUCKET UNICO DE INGESTA
  # =========================================================
  # El enunciado pide UN bucket S3 para los archivos de la ingesta. La
  # separacion entre fuentes se hace por prefijo (ingesta/<db_name>/),
  # no por bucket. El sufijo de AccountId evita el choque de nombres
  # globales entre cuentas del grupo.
  DatosBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "${NombreBucketDatos}-${AWS::AccountId}"

  # =========================================================
  # 3. MAQUINAS VIRTUALES (INSTANCIAS EC2)
  # =========================================================

  # --- VM 1: BASE DE DATOS (us-east-1c) ---
  VMDatabase:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-BaseDeDatos"
      ImageId: !Ref AMI
      InstanceType: "t3.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref DBSubnetId
      SecurityGroupIds:
        - !Ref DBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # La AMI trae MySQL nativo preinstalado en el 3306 y choca con el
          # contenedor. Se deshabilita antes de levantar el compose.
          systemctl stop mysql || true
          systemctl disable mysql || true

          git clone https://github.com/logis-cloud/vm-db.git
          cd vm-db
          docker compose up -d

          # Dependencias para los scripts de fake data. Los scripts NO se
          # ejecutan solos: hay que esperar a que las tablas existan y
          # correrlos a mano una unica vez.
          apt-get update -y
          apt-get install -y python3-pip
          pip3 install pymysql psycopg2-binary faker pymongo

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 2: PRODUCCION 1 (us-east-1c) ---
  VMProd1:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-1"
      ImageId: !Ref AMI
      InstanceType: "t3.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref Prod1SubnetId
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          git clone https://github.com/logis-cloud/vm-prod.git
          cd vm-prod

          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git
          git clone https://github.com/logis-cloud/svc-tracking.git
          git clone https://github.com/logis-cloud/svc-analytics.git

          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=db_clientes
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=db_vehiculos
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF

          # ms-envios escucha en 8000 dentro del contenedor (verificado con
          # docker ps: 8003->8000), no en 3000.
          cat > svc-shipments/.env <<EOF
          PORT=8000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/db_envios?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clientes:8000
          VEHICULOS_SERVICE_URL=http://ms-vehiculos:8080
          TOPE_ENVIOS_POR_PAR_POR_DIA=15
          ASSIGNMENT_TZ_OFFSET_HOURS=-5
          CORS_ALLOWED_ORIGINS=*
          EOF

          # Los contenedores se llaman en espanol. Con ms-clients o
          # ms-shipments, tracking levanta pero no resuelve a ninguno.
          cat > svc-tracking/.env <<EOF
          CLIENTES_SERVICE_URL=http://ms-clientes:8000
          ENVIOS_SERVICE_URL=http://ms-envios:8000
          VEHICULOS_SERVICE_URL=http://ms-vehiculos:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-analytics/.env <<EOF
          AWS_REGION=us-east-1
          DATABASE_GLUE=logistica
          ATHENA_WORKGROUP=logis-analytics-wg
          S3_STAGING_DIR=s3://logis-athena-results-${AWS::AccountId}/results/
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 3: PRODUCCION 2 (us-east-1a) ---
  VMProd2:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-2"
      ImageId: !Ref AMI
      InstanceType: "t3.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref Prod2SubnetId
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          git clone https://github.com/logis-cloud/vm-prod.git
          cd vm-prod

          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git
          git clone https://github.com/logis-cloud/svc-tracking.git
          git clone https://github.com/logis-cloud/svc-analytics.git

          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=db_clientes
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=db_vehiculos
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-shipments/.env <<EOF
          PORT=8000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/db_envios?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clientes:8000
          VEHICULOS_SERVICE_URL=http://ms-vehiculos:8080
          TOPE_ENVIOS_POR_PAR_POR_DIA=15
          ASSIGNMENT_TZ_OFFSET_HOURS=-5
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-tracking/.env <<EOF
          CLIENTES_SERVICE_URL=http://ms-clientes:8000
          ENVIOS_SERVICE_URL=http://ms-envios:8000
          VEHICULOS_SERVICE_URL=http://ms-vehiculos:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-analytics/.env <<EOF
          AWS_REGION=us-east-1
          DATABASE_GLUE=logistica
          ATHENA_WORKGROUP=logis-analytics-wg
          S3_STAGING_DIR=s3://logis-athena-results-${AWS::AccountId}/results/
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 4: INGESTA (us-east-1d) ---
  VMIngesta:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Ingesta-DS"
      ImageId: !Ref AMI
      InstanceType: "t3.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref IngestaSubnetId
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref IngestionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # Solo lee por IP privada desde VMDatabase y escribe a S3. Las
          # credenciales de S3 vienen del instance profile, no de un archivo.
          git clone https://github.com/logis-cloud/vm-ingesta.git
          cd vm-ingesta

          # Los 3 contenedores escriben al MISMO bucket, separados por
          # prefijo. INTERVALO_INGESTA=86400 (1 vez al dia): con 60 seg se
          # vuelca todo cada minuto y Athena cuenta las copias repetidas.
          cat > ingesta-clientes/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root123
          DB_NAME=db_clientes
          S3_BUCKET_NAME=${DatosBucket}
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=86400
          RETRY_INGESTA=10
          EOF

          cat > ingesta-vehiculos/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres123
          DB_NAME=db_vehiculos
          S3_BUCKET_NAME=${DatosBucket}
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=86400
          RETRY_INGESTA=10
          EOF

          cat > ingesta-envios/.env <<EOF
          MONGO_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/db_envios?authSource=admin
          DB_NAME=db_envios
          S3_BUCKET_NAME=${DatosBucket}
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=86400
          RETRY_INGESTA=10
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # =========================================================
  # 4. APPLICATION LOAD BALANCER (INTERNO)
  # =========================================================
  # Un unico listener en :80. El reparto se decide por la RUTA del URL,
  # no por el puerto. Asi el gateway expone una sola direccion y agregar
  # un microservicio es agregar una regla, no una puerta nueva.
  ProductionALB:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: "logis-production-alb"
      Scheme: "internal"
      Type: "application"
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref ALBSubnet1Id
        - !Ref ALBSubnet2Id
      Tags:
        - Key: "Name"
          Value: "logis-production-alb"

  # Todos los health checks apuntan a "/" porque es la unica ruta que los
  # cinco microservicios exponen. Con /health los destinos quedan
  # unhealthy y el ALB devuelve 503 aunque los contenedores esten bien.
  ClientsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-clients"
      Port: 8001
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8001
        - Id: !Ref VMProd2
          Port: 8001

  VehiclesTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-vehicles"
      Port: 8002
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8002
        - Id: !Ref VMProd2
          Port: 8002

  ShipmentsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-shipments"
      Port: 8003
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8003
        - Id: !Ref VMProd2
          Port: 8003

  # ms-analitica corre en el 8004 (verificado con docker ps).
  AnalyticsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-analytics"
      Port: 8004
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8004
        - Id: !Ref VMProd2
          Port: 8004

  # ms-tracking es el que ocupa el 8005.
  TrackingTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-tracking"
      Port: 8005
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8005
        - Id: !Ref VMProd2
          Port: 8005

  ProductionALBListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref ProductionALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: "text/plain"
            MessageBody: "Ruta no encontrada"

  ClientsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/", "/clientes", "/clientes/*", "/direcciones", "/direcciones/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ClientsTargetGroup

  VehiclesALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/vehiculos", "/vehiculos/*", "/conductores", "/conductores/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref VehiclesTargetGroup

  ShipmentsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 30
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/envios", "/envios/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ShipmentsTargetGroup

  AnalyticsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 40
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/analitica", "/analitica/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AnalyticsTargetGroup

  TrackingALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 50
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/trackings", "/trackings/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TrackingTargetGroup

  # =========================================================
  # 5. API GATEWAY (HTTP API) + VPC LINK
  # =========================================================
  # Internet -> API Gateway (ANY /{proxy+}) -> VPC Link -> ALB privado :80
  # -> ListenerRules -> Target Groups -> microservicios.

  ProductionApi:
    Type: "AWS::ApiGatewayV2::Api"
    Properties:
      Name: "logis-api"
      ProtocolType: HTTP
      Description: "Punto de entrada publico unico hacia el ALB interno de los microservicios"
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        AllowHeaders: ["*"]

  ProductionVpcLink:
    Type: "AWS::ApiGatewayV2::VpcLink"
    Properties:
      Name: "logis-vpc-link"
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroup
      SubnetIds:
        - !Ref ALBSubnet1Id
        - !Ref ALBSubnet2Id

  ProductionApiIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref ProductionApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref ProductionVpcLink
      IntegrationUri: !Ref ProductionALBListener
      PayloadFormatVersion: "1.0"

  # {proxy+} captura el path completo, necesario para que /clientes/1 o
  # /clientes/1/direcciones/2 lleguen intactos al ALB.
  ProductionApiRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref ProductionApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ProductionApiIntegration}"

  # Ruta explicita para la raiz: {proxy+} no matchea "/" solo.
  ProductionApiRootRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref ProductionApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ProductionApiIntegration}"

  ProductionApiStage:
    Type: "AWS::ApiGatewayV2::Stage"
    Properties:
      ApiId: !Ref ProductionApi
      StageName: "$default"
      AutoDeploy: true

  # =========================================================
  # 6. GLUE + ATHENA
  # =========================================================
  GlueDatabase:
    Type: "AWS::Glue::Database"
    Properties:
      CatalogId: !Ref "AWS::AccountId"
      DatabaseInput:
        Name: "logistica"
        Description: "Catalogo unificado (clientes, vehiculos, envios) para Athena"

  # Los 3 crawlers apuntan al prefijo EXACTO dentro del bucket unico. Cada
  # subcarpeta de ultimo nivel se convierte en una tabla del catalogo, que
  # es lo que permite los JOINs. Apuntar a la raiz del bucket es la causa
  # mas comun de que un crawler "corra bien" y no encuentre nada.
  CrawlerClientes:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-clientes"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DatosBucket}/ingesta/db_clientes/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  CrawlerVehiculos:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-vehiculos"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DatosBucket}/ingesta/db_vehiculos/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  CrawlerEnvios:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-envios"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DatosBucket}/ingesta/db_envios/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  AthenaResultsBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "logis-athena-results-${AWS::AccountId}"

  AthenaWorkgroup:
    Type: "AWS::Athena::WorkGroup"
    Properties:
      Name: "logis-analytics-wg"
      State: "ENABLED"
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://logis-athena-results-${AWS::AccountId}/results/"
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false

  # =========================================================
  # 7. IPS ELASTICAS (Para Produccion)
  # =========================================================
  EIPProd1:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd1

  EIPProd2:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd2

# =========================================================
# 8. OUTPUTS
# =========================================================
Outputs:
  IPPrivadaVMBaseDeDatos:
    Description: "IP Privada de la VM de BD (ya se inyecta sola en los .env via UserData)"
    Value: !GetAtt VMDatabase.PrivateIp

  IPPublicaVMProd1:
    Description: "IP Publica Elastica para Produccion 1"
    Value: !Ref EIPProd1

  IPPublicaVMProd2:
    Description: "IP Publica Elastica para Produccion 2"
    Value: !Ref EIPProd2

  BucketDatos:
    Description: "Bucket unico donde la ingesta deja los CSV (usar este nombre en el diagrama)"
    Value: !Ref DatosBucket

  GlueDatabaseName:
    Description: "Nombre del Glue Database para Athena"
    Value: !Ref GlueDatabase

  AthenaWorkgroupName:
    Description: "Workgroup a usar desde svc-analytics"
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: "Bucket donde Athena escribe los resultados de las queries"
    Value: !Ref AthenaResultsBucket

  ProductionALBDnsName:
    Description: "DNS interno del ALB de produccion"
    Value: !GetAtt ProductionALB.DNSName

  ApiGatewayUrl:
    Description: "URL publica del API Gateway (base para el frontend)"
    Value: !Sub "https://${ProductionApi}.execute-api.${AWS::Region}.amazonaws.com"

