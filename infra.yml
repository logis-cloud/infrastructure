AWSTemplateFormatVersion: "2010-09-09"
Description: "Infraestructura Completa Proyecto Cloud - 4 VMs con IaC"

Parameters:
  AMI:
    Type: String
    Default: "ami-0b33d2f1547e52c78"
    Description: "AMI con Docker y Ubuntu preconfigurados"
  KeyName:
    Type: String
    Default: "vockey"
    Description: "Clave SSH de AWS"
  VpcId:
    Type: "AWS::EC2::VPC::Id"
    Description: "VPC donde se crean los Security Groups (selecciona la VPC por defecto de tu cuenta/Learner Lab)"

Resources:
  # =========================================================
  # 1. SECURITY GROUPS (REGLAS DE FIREWALL)
  # =========================================================

  ProdSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso publico para APIs (Prod) y SSH"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        # Puertos publicados por cada microservicio segun su propio
        # docker-compose.yml: 8001 svc-clients, 8002 svc-vehicles,
        # 8003 svc-shipments.
        - IpProtocol: "tcp"
          FromPort: "8001"
          ToPort: "8001"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8002"
          ToPort: "8002"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8003"
          ToPort: "8003"
          CidrIp: "0.0.0.0/0"

  IngestionSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso SSH para VM de Ingesta"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"

  DBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso Privado a Bases de Datos"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup

  # =========================================================
  # 2. MÁQUINAS VIRTUALES (INSTANCIAS EC2)
  # =========================================================

  # --- VM 1: BASE DE DATOS ---
  VMDatabase:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-BaseDeDatos"
      ImageId: !Ref AMI
      # t2.micro (1 GB RAM) no alcanza para correr MySQL + Postgres + Mongo
      # a la vez, menos aun cuando se les carga con los scripts de fake data.
      InstanceType: "t3.small"
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref DBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # La AMI trae MySQL nativo preinstalado, corriendo en el puerto 3306.
          # Choca directo con el contenedor mysql-clients del compose. Se
          # deshabilita ANTES de levantar los contenedores para que no vuelva
          # a arrancar en un reinicio de la VM.
          systemctl stop mysql || true
          systemctl disable mysql || true

          git clone https://github.com/logis-cloud/vm-db.git
          cd vm-db
          docker compose up -d

          # Dependencias para correr manualmente los scripts de fake data
          # (clients/fake_mysql.py, vehicles/fake_postgres.py). Se instalan
          # aca, pero los scripts NO se ejecutan automaticamente: hay que
          # esperar a que las tablas existan (init de MySQL/Postgres) y
          # correrlos a mano una sola vez.
          apt-get update -y
          apt-get install -y python3-pip
          pip3 install pymysql psycopg2-binary faker pymongo

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 2: PRODUCCIÓN 1 ---
  VMProd1:
    Type: "AWS::EC2::Instance"
    # Dependencia explicita: CloudFormation espera a que el RECURSO
    # VMDatabase termine de crearse antes de lanzar esta VM. No garantiza
    # que MySQL/Postgres/Mongo ya esten listos dentro del contenedor (por
    # eso los microservicios deben tolerar reintentos), pero evita el peor
    # caso de que ambas VMs arranquen literalmente a la vez.
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-1"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # Repositorio con el docker-compose.yml de nivel superior que
          # levanta los 3 microservicios juntos.
          git clone https://github.com/logis-cloud/vm-prod.git 
          cd vm-prod 

          # Clona cada microservicio como subcarpeta dentro del stack.
          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git

          # Genera el .env de cada microservicio con la IP PRIVADA REAL
          # de la VM de base de datos, resuelta por CloudFormation.
          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=clients_db
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=vehicles_db
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF


          cat > svc-shipments/.env <<EOF
          PORT=3000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/envios_db?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 3: PRODUCCIÓN 2 ---
  VMProd2:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-2"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          git clone https://github.com/logis-cloud/vm-prod.git 
          cd vm-prod 

          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git

          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=clients_db
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=vehicles_db
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-shipments/.env <<EOF
          PORT=3000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/envios_db?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 4: INGESTA (Data Science) ---
  VMIngesta:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Ingesta-DS"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref IngestionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu
          # git clone https://github.com/tu-usuario/repo-ingesta.git
          chown -R ubuntu:ubuntu /home/ubuntu

  # =========================================================
  # 3. IPS ELÁSTICAS (Para Producción)
  # =========================================================
  EIPProd1:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd1

  EIPProd2:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd2

# =========================================================
# 4. OUTPUTS
# =========================================================
Outputs:
  IPPrivadaVMBaseDeDatos:
    Description: "IP Privada de la VM de BD (ya se inyecta sola en los .env via UserData)"
    Value: !GetAtt VMDatabase.PrivateIp

  IPPublicaVMProd1:
    Description: "IP Publica Elastica para Produccion 1"
    Value: !Ref EIPProd1

  IPPublicaVMProd2:
    Description: "IP Publica Elastica para Produccion 2"
    Value: !Ref EIPProd2
