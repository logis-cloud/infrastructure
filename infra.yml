AWSTemplateFormatVersion: "2010-09-09"
Description: "Infraestructura Completa Proyecto Cloud - 4 VMs con IaC + API Gateway + Glue/Athena para svc-analytics"

Parameters:
  IngestaInstanceProfile:
    Type: String
    Default: "LabInstanceProfile"
    Description: "Instance profile del Learner Lab; permite a VMIngesta y VMProd escribir/leer S3 y Athena sin credenciales manuales"
  AMI:
    Type: String
    Default: "ami-0b33d2f1547e52c78"
    Description: "AMI con Docker y Ubuntu preconfigurados"
  KeyName:
    Type: String
    Default: "vockey"
    Description: "Clave SSH de AWS"
  VpcId:
    Type: "AWS::EC2::VPC::Id"
    Description: "VPC donde se crean los Security Groups (selecciona la VPC por defecto de tu cuenta/Learner Lab)"
  Prod1SubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0cc09d979bb259e78"
    Description: "Subnet de VMProd1 (us-east-1c)"

  Prod2SubnetId:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0dbb6c9a39936a6ba"
    Description: "Subnet de VMProd2 (us-east-1a)"

  ALBSubnet1Id:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0cc09d979bb259e78"
    Description: "Subnet 1 del ALB (us-east-1c)"

  ALBSubnet2Id:
    Type: "AWS::EC2::Subnet::Id"
    Default: "subnet-0dbb6c9a39936a6ba"
    Description: "Subnet 2 del ALB (us-east-1a)"

Resources:
  # =========================================================
  # 1. SECURITY GROUPS (REGLAS DE FIREWALL)
  # =========================================================

  ALBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso al ALB desde la VPC"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "80"
          ToPort: "80"
          CidrIp: "0.0.0.0/0"

  ProdSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso a APIs de produccion desde el ALB y SSH"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8001"
          ToPort: "8001"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8002"
          ToPort: "8002"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8003"
          ToPort: "8003"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8004"
          ToPort: "8004"
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "8005"
          ToPort: "8005"
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  IngestionSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso SSH para VM de Ingesta"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"

  DBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Acceso Privado a Bases de Datos"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref ProdSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup
        - IpProtocol: "tcp"
          FromPort: "27017"
          ToPort: "27017"
          SourceSecurityGroupId: !Ref IngestionSecurityGroup

  # Security group dedicado a las ENIs que crea el VPC Link de API Gateway.
  # Necesita poder llegar al ALB por el puerto 80; no necesita ingress propio
  # (nadie se conecta directo a estas ENIs), solo egress hacia el ALB.
  VpcLinkSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "SG para las ENIs del VPC Link de API Gateway (HTTP API -> ALB privado)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "tcp"
          FromPort: "80"
          ToPort: "80"
          DestinationSecurityGroupId: !Ref ALBSecurityGroup

  # El ALB es "internal" (scheme privado), así que además de aceptar 80 desde
  # 0.0.0.0/0 (regla ya existente en ALBSecurityGroup, útil solo dentro de la
  # VPC) hace falta permitir explícitamente el tráfico que sale del VPC Link.
  ALBIngressFromVpcLink:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: "tcp"
      FromPort: "80"
      ToPort: "80"
      SourceSecurityGroupId: !Ref VpcLinkSecurityGroup

  # =========================================================
  # 2. MÁQUINAS VIRTUALES (INSTANCIAS EC2)
  # =========================================================

  # --- VM 1: BASE DE DATOS ---
  VMDatabase:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-BaseDeDatos"
      ImageId: !Ref AMI
      # t2.micro (1 GB RAM) no alcanza para correr MySQL + Postgres + Mongo
      # a la vez, menos aun cuando se les carga con los scripts de fake data.
      InstanceType: "t3.small"
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref DBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # La AMI trae MySQL nativo preinstalado, corriendo en el puerto 3306.
          # Choca directo con el contenedor mysql-clients del compose. Se
          # deshabilita ANTES de levantar los contenedores para que no vuelva
          # a arrancar en un reinicio de la VM.
          systemctl stop mysql || true
          systemctl disable mysql || true

          git clone https://github.com/logis-cloud/vm-db.git
          cd vm-db
          docker compose up -d

          # Dependencias para correr manualmente los scripts de fake data
          # (clients/fake_mysql.py, vehicles/fake_postgres.py). Se instalan
          # aca, pero los scripts NO se ejecutan automaticamente: hay que
          # esperar a que las tablas existan (init de MySQL/Postgres) y
          # correrlos a mano una sola vez.
          apt-get update -y
          apt-get install -y python3-pip
          pip3 install pymysql psycopg2-binary faker pymongo

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 2: PRODUCCIÓN 1 ---
  VMProd1:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-1"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref Prod1SubnetId
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # Repositorio con el docker-compose.yml de nivel superior que
          # levanta los microservicios juntos.
          git clone https://github.com/logis-cloud/vm-prod.git 
          cd vm-prod 

          # Clona cada microservicio como subcarpeta dentro del stack.
          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git
          git clone https://github.com/logis-cloud/svc-tracking.git
          git clone https://github.com/logis-cloud/svc-analytics.git

          # Genera el .env de cada microservicio con la IP PRIVADA REAL
          # de la VM de base de datos, resuelta por CloudFormation.
          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=clients_db
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=vehicles_db
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF


          cat > svc-shipments/.env <<EOF
          PORT=3000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/shipments_db?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          TOPE_ENVIOS_POR_PAR_POR_DIA=15
          ASSIGNMENT_TZ_OFFSET_HOURS=-5
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-tracking/.env <<EOF
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          ENVIOS_SERVICE_URL=http://ms-shipments:3000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-analytics/.env <<EOF
          AWS_REGION=us-east-1
          DATABASE_GLUE=logis_analytics
          ATHENA_WORKGROUP=logis-analytics-wg
          S3_STAGING_DIR=s3://logis-athena-results-${AWS::AccountId}/results/
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 3: PRODUCCIÓN 2 ---
  VMProd2:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Produccion-2"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      SubnetId: !Ref Prod2SubnetId
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref ProdSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          git clone https://github.com/logis-cloud/vm-prod.git 
          cd vm-prod 

          git clone https://github.com/logis-cloud/svc-clients.git
          git clone https://github.com/logis-cloud/svc-vehicles.git
          git clone https://github.com/logis-cloud/svc-shipments.git
          git clone https://github.com/logis-cloud/svc-tracking.git
          git clone https://github.com/logis-cloud/svc-analytics.git

          cat > svc-clients/.env <<EOF
          DB_USER=root
          DB_PASSWORD=root123
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_NAME=clients_db
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-vehicles/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_NAME=vehicles_db
          DB_USER=postgres
          DB_PASSWORD=postgres123
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-shipments/.env <<EOF
          PORT=3000
          MONGODB_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/shipments_db?authSource=admin
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          TOPE_ENVIOS_POR_PAR_POR_DIA=15
          ASSIGNMENT_TZ_OFFSET_HOURS=-5
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-tracking/.env <<EOF
          CLIENTES_SERVICE_URL=http://ms-clients:8000
          ENVIOS_SERVICE_URL=http://ms-shipments:3000
          VEHICULOS_SERVICE_URL=http://ms-vehicles:8080
          CORS_ALLOWED_ORIGINS=*
          EOF

          cat > svc-analytics/.env <<EOF
          AWS_REGION=us-east-1
          DATABASE_GLUE=logis_analytics
          ATHENA_WORKGROUP=logis-analytics-wg
          S3_STAGING_DIR=s3://logis-athena-results-${AWS::AccountId}/results/
          EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # --- VM 4: INGESTA (Data Science) ---
  VMIngesta:
    Type: "AWS::EC2::Instance"
    DependsOn: VMDatabase
    Properties:
      Tags:
        - Key: "Name"
          Value: "VM-Ingesta-DS"
      ImageId: !Ref AMI
      InstanceType: "t2.micro"
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref IngestaInstanceProfile
      SecurityGroupIds:
        - !Ref IngestionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cd /home/ubuntu

          # VM de Ingesta: no corre bases de datos, solo lee por IP privada
          # desde VMDatabase y escribe a S3. Las credenciales de S3 vienen
          # del instance profile (IamInstanceProfile arriba), no de un
          # archivo de credenciales manual.
          git clone https://github.com/logis-cloud/vm-ingesta.git
          cd vm-ingesta

          cat > ingesta-clientes/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root123
          DB_NAME=clients_db
          S3_BUCKET_NAME=logis-clientes
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=60
          RETRY_INGESTA=10
          EOF

          cat > ingesta-vehiculos/.env <<EOF
          DB_HOST=${VMDatabase.PrivateIp}
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres123
          DB_NAME=vehicles_db
          S3_BUCKET_NAME=logis-vehiculos
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=60
          RETRY_INGESTA=10
          EOF

          cat > ingesta-envios/.env <<EOF
          MONGO_URI=mongodb://root:root123@${VMDatabase.PrivateIp}:27017/shipments_db?authSource=admin
          DB_NAME=shipments_db
          S3_BUCKET_NAME=logis-envios
          AWS_REGION=us-east-1
          INTERVALO_INGESTA=60
          RETRY_INGESTA=10
          EOF

          # --- Fallback manual: solo si LabInstanceProfile no existe con ---
          # --- ese nombre en tu cuenta. Descomenta y reemplaza los 3     ---
          # --- placeholders con las credenciales temporales del Lab.    ---
          # mkdir -p /home/ubuntu/.aws
          # cat > /home/ubuntu/.aws/credentials <<EOF
          # [default]
          # aws_access_key_id=PLACEHOLDER_ACCESS_KEY_ID
          # aws_secret_access_key=PLACEHOLDER_SECRET_ACCESS_KEY
          # aws_session_token=PLACEHOLDER_SESSION_TOKEN
          # EOF

          docker compose up -d --build

          chown -R ubuntu:ubuntu /home/ubuntu

  # =========================================================
  # 3. APPLICATION LOAD BALANCER
  # =========================================================
  ProductionALB:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: "logis-production-alb"
      Scheme: "internal"
      Type: "application"
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref ALBSubnet1Id
        - !Ref ALBSubnet2Id
      Tags:
        - Key: "Name"
          Value: "logis-production-alb"

  ClientsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-clients"
      Port: 8001
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8001
        - Id: !Ref VMProd2
          Port: 8001

  VehiclesTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-vehicles"
      Port: 8002
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/health"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8002
        - Id: !Ref VMProd2
          Port: 8002

  ShipmentsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-shipments"
      Port: 8003
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/health"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8003
        - Id: !Ref VMProd2
          Port: 8003

  TrackingTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-tracking"
      Port: 8004
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8004
        - Id: !Ref VMProd2
          Port: 8004

  AnalyticsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "tg-analytics"
      Port: 8005
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: "/health"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref VMProd1
          Port: 8005
        - Id: !Ref VMProd2
          Port: 8005

  ProductionALBListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref ProductionALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: "text/plain"
            MessageBody: "Ruta no encontrada"

  ClientsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/", "/clientes", "/clientes/*", "/direcciones/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ClientsTargetGroup

  VehiclesALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/vehiculos", "/vehiculos/*", "/conductores", "/conductores/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref VehiclesTargetGroup

  ShipmentsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 30
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/envios", "/envios/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ShipmentsTargetGroup

  TrackingALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 40
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/trackings", "/trackings/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TrackingTargetGroup

  AnalyticsALBRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref ProductionALBListener
      Priority: 50
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/analitica", "/analitica/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AnalyticsTargetGroup

  # =========================================================
  # 4. API GATEWAY (HTTP API) + VPC LINK
  # =========================================================
  # Réplica en IaC de lo que se configuró a mano en la consola:
  # Internet -> API Gateway (ANY /{proxy+}) -> VPC Link -> ALB privado :80
  # -> ListenerRules -> Target Groups -> microservicios.

  ProductionApi:
    Type: "AWS::ApiGatewayV2::Api"
    Properties:
      Name: "logis-api"
      ProtocolType: HTTP
      Description: "Punto de entrada público único hacia el ALB interno de los microservicios"

  ProductionVpcLink:
    Type: "AWS::ApiGatewayV2::VpcLink"
    Properties:
      Name: "logis-vpc-link"
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroup
      SubnetIds:
        - !Ref ALBSubnet1Id
        - !Ref ALBSubnet2Id

  ProductionApiIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref ProductionApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref ProductionVpcLink
      IntegrationUri: !Ref ProductionALBListener
      PayloadFormatVersion: "1.0"

  # Ruta greedy: {proxy+} captura el path completo (uno o más segmentos),
  # necesario para que /clientes/1, /clientes/1/direcciones/2, etc. lleguen
  # intactos hasta el ALB. Sin el "+" solo se captura un segmento.
  ProductionApiRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref ProductionApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ProductionApiIntegration}"

  # Ruta explícita para la raíz ("/"), ya que {proxy+} no matchea "/" solo.
  ProductionApiRootRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref ProductionApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ProductionApiIntegration}"

  ProductionApiStage:
    Type: "AWS::ApiGatewayV2::Stage"
    Properties:
      ApiId: !Ref ProductionApi
      StageName: "$default"
      AutoDeploy: true

  # =========================================================
  # 5. GLUE + ATHENA (para svc-analytics)
  # =========================================================
  # Database compartido: los 3 buckets (logis-clientes, logis-vehiculos,
  # logis-envios) catalogan sus tablas acá, no cada uno en su propio
  # database, para que los JOINs entre ellos funcionen en Athena
  # (ej. envios JOIN clientes ON clienteid = id).
  GlueDatabase:
    Type: "AWS::Glue::Database"
    Properties:
      CatalogId: !Ref "AWS::AccountId"
      DatabaseInput:
        Name: "logis_analytics"
        Description: "Catálogo unificado (clientes, vehiculos, envios) para Athena"

  # Los 3 Crawlers usan LabRole por ARN (mismo role detrás de
  # LabInstanceProfile) porque en Learner Lab no se pueden crear roles
  # IAM nuevos. Apuntan cada uno al prefijo EXACTO donde la ingesta deja
  # los CSVs (ingesta/<db_name>/), no a la raíz del bucket — apuntar a la
  # raíz es la causa más común de que el Crawler "corra bien" pero no
  # encuentre datos.
  CrawlerClientes:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-clientes"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: "s3://logis-clientes/ingesta/clients_db/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  CrawlerVehiculos:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-vehiculos"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: "s3://logis-vehiculos/ingesta/vehicles_db/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  CrawlerEnvios:
    Type: "AWS::Glue::Crawler"
    Properties:
      Name: "crawler-logis-envios"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: "s3://logis-envios/ingesta/shipments_db/"
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"

  # Bucket de resultados de Athena. Nombre con AccountId para que sea
  # único a nivel global (choca si dos alumnos usan el mismo nombre corto).
  AthenaResultsBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "logis-athena-results-${AWS::AccountId}"

  # EnforceWorkGroupConfiguration=true fuerza a que cualquier query
  # (consola o svc-analytics vía boto3) use este OutputLocation, sin que
  # cada llamada tenga que especificarlo.
  AthenaWorkgroup:
    Type: "AWS::Athena::WorkGroup"
    Properties:
      Name: "logis-analytics-wg"
      State: "ENABLED"
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://logis-athena-results-${AWS::AccountId}/results/"
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false

# =========================================================
# 6. IPS ELÁSTICAS (Para Producción)
# =========================================================
  EIPProd1:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd1

  EIPProd2:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref VMProd2

# =========================================================
# 7. OUTPUTS
# =========================================================
Outputs:
  IPPrivadaVMBaseDeDatos:
    Description: "IP Privada de la VM de BD (ya se inyecta sola en los .env via UserData)"
    Value: !GetAtt VMDatabase.PrivateIp

  IPPublicaVMProd1:
    Description: "IP Publica Elastica para Produccion 1"
    Value: !Ref EIPProd1

  IPPublicaVMProd2:
    Description: "IP Publica Elastica para Produccion 2"
    Value: !Ref EIPProd2

  GlueDatabaseName:
    Description: "Nombre del Glue Database para Athena (usar en svc-analytics)"
    Value: !Ref GlueDatabase

  AthenaWorkgroupName:
    Description: "Workgroup a usar desde svc-analytics (boto3 athena client)"
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: "Bucket donde Athena escribe los resultados de las queries"
    Value: !Ref AthenaResultsBucket

  ProductionALBDnsName:
    Description: "DNS interno del ALB de produccion"
    Value: !GetAtt ProductionALB.DNSName

  ApiGatewayUrl:
    Description: "URL pública del API Gateway (usar como base para el frontend, ej: VITE_API_CLIENTES_URL=<esto>)"
    Value: !Sub "https://${ProductionApi}.execute-api.${AWS::Region}.amazonaws.com"
